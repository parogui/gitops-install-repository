# ApplicationSet that installs a second Argo CD instance (Helm) into namespace "argocd".
# This resource must be applied to a cluster that ALREADY has an ApplicationSet controller
# (typically the default OpenShift GitOps Argo CD in openshift-gitops).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: argocd-helm-bootstrap
  namespace: openshift-gitops
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - name: parodrig3-cluster1
            server: https://api.parodrig3-cluster1.sbr-shift.gsslab.brq2.redhat.com:6443
  template:
    metadata:
      name: "{{.name}}-argocd"
    spec:
      project: default
      source:
        repoURL: https://github.com/parogui/gitops-install-repository.git
        targetRevision: HEAD
        path: remote
      destination:
        server: "{{.server}}"
        namespace: "argocd"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
